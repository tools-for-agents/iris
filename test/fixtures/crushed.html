<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>crushed</title>
<style>
  /* recall's bug, reproduced: a two-column template under a ONE-column area map. */
  body { margin:0; font:16px/1.5 system-ui, sans-serif; background:#0b0d12; color:#e8ebf2;
         display:grid; grid-template-columns:260px 1fr; grid-template-areas:"top top" "rail main"; }
  @media (max-width:720px) { body { grid-template-columns:1fr; grid-template-areas:"top" "rail" "main"; } }
  @media (max-width:780px) { body { grid-template-columns:0 1fr; } .rail { display:none; } }
  header { grid-area:top; padding:12px; } header a { color:#cfe3ff; display:inline-block; padding:4px 0; min-height:24px; }
  .rail { grid-area:rail; }
  main { grid-area:main; padding:0 12px; min-width:0; }
  /* a narrow sidebar of SHORT labels is not crushed — it is a sidebar */
  nav { width:90px; }
</style></head>
<body>
  <header>recall <nav><a href="#">brain</a> <a href="#">code</a></nav></header>
  <aside class="rail">sources</aside>
  <main>
    <p>He told me he won a computer in the raffle at work, the first time in his life, and that something was opening for him.</p>
    <p>A second paragraph, also long enough to be prose, so the report must still come once for the column and not once per paragraph.</p>
  </main>
</body></html>
